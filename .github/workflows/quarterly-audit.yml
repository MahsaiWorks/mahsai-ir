name: Quarterly site audit

on:
  schedule:
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and inspect the complete static site
        run: |
          pnpm check
          pnpm build
          pnpm audit:static
          pnpm qa:browser
          pnpm audit:lighthouse
          pnpm audit:external

      - name: Append the freshness report
        if: always()
        run: pnpm audit:stale >> "$GITHUB_STEP_SUMMARY"

      - name: Open the human review checklist
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'بازبینی فصلی سایت MAHSAI';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (issues.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                'چک‌لیست کامل: `docs/QUARTERLY_SITE_AUDIT.md`',
                '',
                '- [ ] داده‌های Search Console و Analytics مرور شد',
                '- [ ] نیازهای جست‌وجویی و رقیبان ایرانی بازبینی شدند',
                '- [ ] صفحات کلیدی روی موبایل و صفحه‌خوان کنترل شدند',
                '- [ ] وضعیت حقوقی، DNS، ایمیل و امنیت بررسی شد',
                `- [ ] نتیجهٔ اجرای خودکار بررسی شد: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
